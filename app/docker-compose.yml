# One Flask container serving the Social Club page.
# Host port 80 -> container port 5000 (Flask). On the Azure VM the NSG allows 80,
# so the site is reachable at http://<public-ip>. Locally it's http://localhost.
name: social-club

services:
  web:
    build: .
    ports:
      - "80:5000"
    restart: unless-stopped
    # Deliberately starve the container so external load (Locust) can overwhelm
    # it. These are real resource caps, not simulated slowness. Tune as needed.
    cpus: "0.1"        # a tenth of one vCPU
    mem_limit: "64m"   # OOM-killed if it balloons under load
